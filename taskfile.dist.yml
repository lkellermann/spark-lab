version: '3'

vars:
  COMPOSE_FILE: ./docker/composeAlpine.yml
  WORKER_COUNT: 1

tasks:
  volumes-permissions:
    desc: Set permissions for data, apps, and logs directories
    cmds:
      - chmod -R 777 ./data
      - chmod -R 777 ./spark-apps
      - chmod -R 777 ./spark-logs
  build:
    desc: Build the Docker images
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} build

  build-nc:
    desc: Build the Docker images without cache
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} build --no-cache

  down:
    desc: Stop and remove containers, networks, and volumes
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down --volumes

  run:
    desc: Run the Spark cluster with specified number of workers
    deps: [down, volumes-permissions]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up --scale spark-worker={{.WORKER_COUNT}}

  rund:
    desc: Run the Spark cluster with specified number of workers
    deps: [down, volumes-permissions]
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --scale spark-worker={{.WORKER_COUNT}}

  stop:
    desc: Stop all containers
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} stop

  submit:
    desc: Submit a Spark application to the cluster
    vars:
      APP: '{{default "" .APP}}'
    cmds:
      - |
        if [ -z "{{.APP}}" ]; then
          echo "Error: Please specify the app parameter. Usage: task submit APP=your-app-name"
          exit 1
        fi
      - docker exec spark-master-alpine spark-submit --master spark://spark-master:7077 --deploy-mode client ./apps/{{.APP}}